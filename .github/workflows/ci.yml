name: CI

on:
  push:          # every branch, so work in progress is checked too
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]  # 3.10 = ML worker image, 3.11 = API image
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: insure
          POSTGRES_PASSWORD: insure
          POSTGRES_DB: insure_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U insure" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-hin
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - name: Migrations apply cleanly and match models
        run: alembic upgrade head && alembic check
        env:
          DATABASE_URL: postgresql+psycopg://insure:insure@localhost:5432/insure_test
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://insure:insure@localhost:5432/insure_test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"  # same as the development PC, so CI fails when the PC would
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  # Unit tests cannot catch Gradle, plugin or manifest problems (a native plugin once broke the Android build
  # while every test passed). This job builds the real APK the way `flutter run` does on the PC.
  android-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.kts', 'mobile/android/gradle/wrapper/gradle-wrapper.properties', 'mobile/pubspec.lock') }}
      - run: flutter pub get
      - name: Debug APK (what `flutter run` builds)
        run: flutter build apk --debug
      - name: Release APK with production settings (release guard, R8, resources)
        run: >-
          flutter build apk --release
          --dart-define=ENV=production
          --dart-define=API_BASE_URL=https://api.example.org/api/v1
          --dart-define=SUPPORT_EMAIL=support@capitup.test
          --dart-define=GRIEVANCE_OFFICER="CI check, grievance@capitup.test"
