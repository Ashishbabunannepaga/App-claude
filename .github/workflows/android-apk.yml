# Builds an installable Android APK you can download from the Actions tab — no Android Studio needed.
# Run it from GitHub: Actions → "Android APK" → Run workflow → enter your backend URL.
name: Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend URL the app should use, e.g. https://api.example.com/api/v1"
        required: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      # Release build signed with the debug key: fine for testing on your own phones.
      # For the Play Store, add an upload keystore (see docs/01-technical-blueprint.md §16).
      - run: flutter build apk --release --dart-define=API_BASE_URL=${{ inputs.api_base_url }} --dart-define=ENV=staging
      - uses: actions/upload-artifact@v4
        with:
          name: insureiq-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
